<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACT2511 - Employee ID Card</title>
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #2563eb;
            --secondary: #0ea5e9;
            --slate: #0f172a;
            --slate-light: #1e293b;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        }
        
        body {
            background-color: var(--slate);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.15), transparent 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative background elements */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: float 10s ease-in-out infinite alternate;
        }
        
        body::before {
            background: var(--primary);
            top: -100px;
            left: -100px;
        }
        
        body::after {
            background: var(--secondary);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(40px);
        }
        
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 30px 60px -10px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.3) inset;
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            text-align: center;
            padding: 32px 20px 70px;
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle pattern overlay in header */
        .card-header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.15) 1px, transparent 0);
            background-size: 20px 20px;
            z-index: 0;
        }
        
        .card-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .card-header p {
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0.9;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
        
        .profile-wrapper {
            display: flex;
            justify-content: center;
            margin-top: -60px;
            position: relative;
            z-index: 10;
        }
        
        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            background-color: #f1f5f9;
            object-fit: cover;
            box-shadow: 
                0 10px 25px -5px rgba(0, 0, 0, 0.15),
                0 0 0 4px rgba(255,255,255,0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .card:hover .profile-photo {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 
                0 15px 30px -5px rgba(0, 0, 0, 0.2),
                0 0 0 4px rgba(255,255,255,0.7);
        }
        
        .card-body {
            padding: 24px 32px 32px;
            text-align: center;
        }
        
        .name {
            color: var(--slate);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        
        .designation {
            color: var(--primary);
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(37, 99, 235, 0.1);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            text-align: left;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
            background: white;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .detail-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--primary);
            border-radius: 3px 0 0 3px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .detail-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 12px -3px rgba(0, 0, 0, 0.08);
        }
        
        .detail-item:hover::before {
            opacity: 1;
        }
        
        .detail-label {
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }
        
        .detail-value {
            color: var(--slate);
            font-size: 1.05rem;
            font-weight: 600;
        }
        
        .footer {
            background-color: var(--slate);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            position: relative;
            overflow: hidden;
        }
        
        .footer::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1>Acadeno</h1>
            <p>Employee Identity Card</p>
        </div>
        <div class="profile-wrapper">
            <img src="../../assets/photos/ACT2511.jpg" alt="Profile Photo of ACT2511" class="profile-photo" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2394a3b8%22%20stroke-width%3D%221.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%228%22%20r%3D%225%22%2F%3E%3Cpath%20d%3D%22M20%2021a8%208%200%200%200-16%200%22%2F%3E%3C%2Fsvg%3E';">
        </div>
        <div class="card-body">
            <h2 class="name">Yafiz Mohammed</h2>
            <div class="designation">[Designation]</div>
            
            <div class="details-grid">
                <div class="detail-item">
                    <span class="detail-label">Employee ID</span>
                    <span class="detail-value">ACT2511</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Date of Birth</span>
                    <span class="detail-value">[DD/MM/YYYY]</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Blood Group</span>
                    <span class="detail-value">[Blood Group]</span>
                </div>
            </div>
        </div>
        <div class="footer">
            WWW.ACADENO.COM
        </div>
    </div>
</body>
</html>
